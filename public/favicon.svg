<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d27;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8960c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- P letterform -->
  <text x="256" y="340" 
    font-family="Georgia, serif" 
    font-size="300" 
    font-weight="bold"
    text-anchor="middle" 
    fill="white"
    opacity="0.95">P</text>
  <!-- gold underline accent -->
  <rect x="120" y="390" width="272" height="18" rx="9" fill="url(#gold)"/>
  <!-- small Bangla taka symbol top-right decoration -->
  <text x="400" y="145" 
    font-family="Arial, sans-serif"
    font-size="72"
    font-weight="bold"
    text-anchor="middle"
    fill="url(#gold)"
    opacity="0.9">৳</text>
</svg>